services:
  - type: web
    name: salon-luxe-monolith
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /data
    disk:
      name: salon-db
      mountPath: /data
      sizeGB: 1
